<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c33" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>

    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Consolas', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      fill: #f8fafc;
      letter-spacing: 2px;
    }
    .role {
      font-size: 16.5px;
      font-weight: 700;
      fill: url(#accentGrad);
      letter-spacing: 1.8px;
    }
    .sub {
      font-size: 13.5px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .card {
      fill: url(#cardGrad);
      stroke: #1e293b;
      stroke-width: 1.2;
      rx: 8;
    }
    .card-label {
      font-size: 10px;
      fill: #64748b;
      letter-spacing: 1px;
    }
    .card-val {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }
    .pulse-dot {
      fill: #10b981;
      animation: pulse 2s infinite ease-in-out;
    }
    .cursor {
      fill: #00f0ff;
      animation: blink 1.1s infinite step-end;
    }
    .circuit-line {
      stroke-dasharray: 10 8;
      animation: flow 20s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes flow {
      to { stroke-dashoffset: -360; }
    }
  </style>

  <!-- Outer Frame -->
  <rect width="1000" height="300" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1000" height="300" rx="14" fill="url(#grid)"/>

  <!-- Decorative Subtle Background Circuit Lines (Right Side, non-intrusive) -->
  <g opacity="0.22" stroke="url(#accentGrad)" stroke-width="1.5" fill="none">
    <path d="M 760 55 L 830 55 L 860 85 L 960 85" class="circuit-line"/>
    <path d="M 810 120 L 875 120 L 900 95 L 960 95" class="circuit-line"/>
    <path d="M 790 165 L 860 165 L 885 140 L 960 140" class="circuit-line"/>
    <circle cx="760" cy="55" r="3" fill="#00f0ff"/>
    <circle cx="810" cy="120" r="3" fill="#7aa2f7"/>
    <circle cx="790" cy="165" r="3" fill="#bb9af7"/>
  </g>

  <!-- Terminal Top Window Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 986 2 Q 998 2 998 14 L 998 38 L 2 38 Z" fill="#070a12" opacity="0.95"/>
  <line x1="2" y1="38" x2="998" y2="38" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="0" y="0" width="1000" height="3" rx="1.5" fill="url(#accentGrad)"/>

  <!-- Window Controls -->
  <circle cx="24" cy="20" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="5.5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="500" y="24" text-anchor="middle" class="mono" font-size="11.5" fill="#64748b">
    miqueas@ha-cluster-01: ~/architecture — zsh
  </text>

  <!-- Right Online Status in Title Bar -->
  <circle cx="852" cy="20" r="4" class="pulse-dot"/>
  <text x="864" y="24" class="mono" font-size="11" font-weight="700" fill="#10b981">
    SYSTEM ONLINE
  </text>

  <!-- Main Content -->
  <!-- Prompt Line with inline cursor so it never misaligns -->
  <text x="44" y="72" class="mono" font-size="12.5" fill="#94a3b8">
    <tspan fill="#10b981" font-weight="700">root@arch-node</tspan>:<tspan fill="#38bdf8">~</tspan># ./init_architect.sh --profile="Miqueas Aguirre" --ha-mode<tspan class="cursor"> █</tspan>
  </text>

  <!-- Name -->
  <text x="44" y="124" class="sans title">MIQUEAS AGUIRRE</text>

  <!-- Role -->
  <text x="44" y="156" class="mono role">&gt; BACKEND LEAD &amp; PYTHON ARCHITECT  //  INFRASTRUCTURE &amp; AI ENGINEER</text>

  <!-- Subtitle -->
  <text x="44" y="186" class="sans sub">
    High-Availability Infrastructure  •  Distributed Broker Mesh  •  Real-Time Industrial IoT  •  Enterprise AI &amp; Local LLMs
  </text>

  <!-- 4 Telemetry HUD Cards at Bottom (Full Width, Balanced, Zero Overflow) -->
  <!-- Card 1 -->
  <g transform="translate(42, 214)">
    <rect x="0" y="0" width="217" height="58" class="card"/>
    <line x1="10" y1="0" x2="64" y2="0" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
    <text x="18" y="23" class="mono card-label">// EXPERIENCE</text>
    <text x="18" y="44" class="mono card-val" fill="#38bdf8">5+ YEARS PRODUCTION</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(275, 214)">
    <rect x="0" y="0" width="217" height="58" class="card"/>
    <line x1="10" y1="0" x2="64" y2="0" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <text x="18" y="23" class="mono card-label">// ARCHITECTURE</text>
    <text x="18" y="44" class="mono card-val" fill="#34d399">HA &amp; MULTI-TENANT</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(508, 214)">
    <rect x="0" y="0" width="217" height="58" class="card"/>
    <line x1="10" y1="0" x2="64" y2="0" stroke="#bb9af7" stroke-width="2" stroke-linecap="round"/>
    <text x="18" y="23" class="mono card-label">// AI &amp; DATA ENGINE</text>
    <text x="18" y="44" class="mono card-val" fill="#c084fc">ML &amp; LOCAL LLMs</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(741, 214)">
    <rect x="0" y="0" width="217" height="58" class="card"/>
    <line x1="10" y1="0" x2="64" y2="0" stroke="#7aa2f7" stroke-width="2" stroke-linecap="round"/>
    <text x="18" y="23" class="mono card-label">// LOCATION</text>
    <text x="18" y="44" class="mono card-val" fill="#f8fafc">BUENOS AIRES, AR</text>
  </g>
</svg>
