<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73daca"/>
      <stop offset="100%" stop-color="#2ac3de"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .title {
      font-size: 40px;
      font-weight: 800;
      fill: #f8fafc;
      letter-spacing: 1.5px;
    }
    .role {
      font-size: 18px;
      font-weight: 700;
      fill: url(#accentGrad);
      letter-spacing: 2px;
    }
    .sub {
      font-size: 13px;
      fill: #94a3b8;
      letter-spacing: 0.6px;
    }
    .badge-bg {
      fill: #0f172a;
      stroke: #1e293b;
      stroke-width: 1.2;
      rx: 6;
    }
    .badge-label {
      font-size: 11px;
      fill: #64748b;
    }
    .badge-val {
      font-size: 11px;
      font-weight: 700;
      fill: #38bdf8;
    }
    .pulse-dot {
      fill: #10b981;
      animation: pulse 2s infinite ease-in-out;
    }
    .cursor {
      fill: #00f0ff;
      animation: blink 1.1s infinite step-end;
    }
    .data-line {
      stroke-dasharray: 8 6;
      animation: dash 18s linear infinite;
    }
    .node {
      animation: nodeGlow 3s infinite alternate ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; r: 4.5px; }
      50% { opacity: 0.35; r: 6px; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -280; }
    }
    @keyframes nodeGlow {
      0% { opacity: 0.45; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Main Card Background -->
  <rect width="1000" height="280" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)"/>

  <!-- Top & Bottom Cyber Accent Bars -->
  <rect x="0" y="0" width="1000" height="4" rx="2" fill="url(#accentGrad)"/>
  <line x1="40" y1="278" x2="960" y2="278" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Right Side Network Topology Illustration (HA Cluster / IoT Mesh) -->
  <g transform="translate(690, 35)" opacity="0.88">
    <!-- Outer frame -->
    <rect x="0" y="0" width="270" height="210" rx="10" fill="#090d16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="22" class="mono" font-size="10" fill="#64748b">// TOPOLOGY: HA_CLUSTER_MESH</text>
    <circle cx="250" cy="18" r="3.5" fill="#10b981"/>

    <!-- Edges -->
    <line x1="55" y1="65" x2="135" y2="55" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.5" class="data-line"/>
    <line x1="55" y1="65" x2="135" y2="115" stroke="#7aa2f7" stroke-width="1.2" stroke-opacity="0.5" class="data-line"/>
    <line x1="55" y1="155" x2="135" y2="115" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.5" class="data-line"/>
    <line x1="55" y1="155" x2="135" y2="170" stroke="#73daca" stroke-width="1.2" stroke-opacity="0.5" class="data-line"/>
    <line x1="135" y1="55" x2="215" y2="85" stroke="#bb9af7" stroke-width="1.4" stroke-opacity="0.6" class="data-line"/>
    <line x1="135" y1="115" x2="215" y2="85" stroke="#00f0ff" stroke-width="1.4" stroke-opacity="0.6" class="data-line"/>
    <line x1="135" y1="115" x2="215" y2="150" stroke="#73daca" stroke-width="1.4" stroke-opacity="0.6" class="data-line"/>
    <line x1="135" y1="170" x2="215" y2="150" stroke="#7aa2f7" stroke-width="1.4" stroke-opacity="0.6" class="data-line"/>

    <!-- Nodes: IoT Edge -->
    <g class="node">
      <circle cx="55" cy="65" r="14" fill="#0f172a" stroke="#00f0ff" stroke-width="1.8"/>
      <text x="55" y="68" text-anchor="middle" class="mono" font-size="8.5" fill="#e2e8f0">MQTT</text>
      <text x="55" y="92" text-anchor="middle" class="mono" font-size="7.5" fill="#64748b">LoRa/SNMP</text>
    </g>

    <g class="node">
      <circle cx="55" cy="155" r="14" fill="#0f172a" stroke="#73daca" stroke-width="1.8"/>
      <text x="55" y="158" text-anchor="middle" class="mono" font-size="8.5" fill="#e2e8f0">KAFKA</text>
      <text x="55" y="182" text-anchor="middle" class="mono" font-size="7.5" fill="#64748b">STREAM</text>
    </g>

    <!-- Nodes: Core Processing -->
    <g class="node">
      <circle cx="135" cy="55" r="15" fill="#0f172a" stroke="#7aa2f7" stroke-width="1.8"/>
      <text x="135" y="58" text-anchor="middle" class="mono" font-size="8" fill="#e2e8f0">FASTAPI</text>
    </g>

    <g class="node">
      <circle cx="135" cy="115" r="17" fill="#1e1b4b" stroke="#bb9af7" stroke-width="2" filter="url(#glow)"/>
      <text x="135" y="118" text-anchor="middle" class="mono" font-size="8.5" font-weight="bold" fill="#ffffff">AI / ML</text>
    </g>

    <g class="node">
      <circle cx="135" cy="170" r="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="135" y="173" text-anchor="middle" class="mono" font-size="8" fill="#e2e8f0">DJANGO</text>
    </g>

    <!-- Nodes: HA Storage & LLMs -->
    <g class="node">
      <circle cx="215" cy="85" r="16" fill="#0f172a" stroke="#00f0ff" stroke-width="1.8"/>
      <text x="215" y="88" text-anchor="middle" class="mono" font-size="8" fill="#e2e8f0">PG-HA</text>
      <text x="215" y="112" text-anchor="middle" class="mono" font-size="7.5" fill="#64748b">CrateDB</text>
    </g>

    <g class="node">
      <circle cx="215" cy="150" r="16" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
      <text x="215" y="153" text-anchor="middle" class="mono" font-size="8" fill="#e2e8f0">LLMs</text>
      <text x="215" y="177" text-anchor="middle" class="mono" font-size="7.5" fill="#64748b">Ollama/Gem</text>
    </g>
  </g>

  <!-- Left Content Area -->
  <!-- Terminal Prompt Bar -->
  <g transform="translate(42, 42)">
    <circle cx="6" cy="-4" r="4.5" class="pulse-dot"/>
    <text x="20" y="0" class="mono" font-size="12" fill="#10b981" font-weight="700">SYSTEM ONLINE</text>
    <text x="125" y="0" class="mono" font-size="12" fill="#475569">|</text>
    <text x="140" y="0" class="mono" font-size="12" fill="#94a3b8">miqueas@arch-cluster:~#</text>
    <text x="315" y="0" class="mono" font-size="12" fill="#38bdf8">./init_profile.sh --mode=production</text>
    <rect x="572" y="-11" width="7" height="14" class="cursor"/>
  </g>

  <!-- Name & Title -->
  <text x="42" y="102" class="sans title">MIQUEAS AGUIRRE</text>
  <text x="42" y="134" class="mono role">&gt; BACKEND LEAD &amp; PYTHON ARCHITECT</text>

  <!-- Core Value Proposition -->
  <text x="42" y="166" class="sans sub">
    High-Availability Infrastructure • Distributed Systems • Real-Time Industrial IoT • Enterprise AI &amp; Local LLMs
  </text>
  <text x="42" y="188" class="mono" font-size="12" fill="#64748b">
    [Python / FastAPI / Django-Bolt / Asyncio]  •  [PostgreSQL HA / CrateDB / Kafka / MQTT Mesh]  •  [Ollama / Gemini]
  </text>

  <!-- Bottom Telemetry Badges -->
  <g transform="translate(42, 215)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="145" height="32" class="badge-bg"/>
    <text x="12" y="20" class="mono badge-label">EXP:</text>
    <text x="46" y="20" class="mono badge-val">5+ YEARS PROD</text>

    <!-- Badge 2 -->
    <rect x="157" y="0" width="175" height="32" class="badge-bg"/>
    <text x="169" y="20" class="mono badge-label">ARCH:</text>
    <text x="210" y="20" class="mono badge-val" fill="#73daca">HA &amp; MULTI-TENANT</text>

    <!-- Badge 3 -->
    <rect x="344" y="0" width="148" height="32" class="badge-bg"/>
    <text x="356" y="20" class="mono badge-label">AI:</text>
    <text x="382" y="20" class="mono badge-val" fill="#bb9af7">ML / LOCAL LLMs</text>

    <!-- Badge 4 -->
    <rect x="504" y="0" width="152" height="32" class="badge-bg"/>
    <text x="516" y="20" class="mono badge-label">LOC:</text>
    <text x="550" y="20" class="mono badge-val" fill="#f8fafc">BUENOS AIRES, AR</text>
  </g>
</svg>

